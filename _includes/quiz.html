  function medal(m) {
    var c = TCOL[m.t], dk = TDK[m.t], on = m.t > 0, sc = '';
    for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6; sc += '<circle cx="' + f1(50 + 27 * Math.cos(a)) + '" cy="' + f1(62 + 27 * Math.sin(a)) + '" r="5.5"/>'; }
    var rib = on ? (m.one ? ['#7a2018', '#1d150b'] : ['#1f5a5a', '#7a2018']) : ['#d8ceb6', '#c4b99e'];
    return '<span class="mdl t' + m.t + (on ? ' on' : '') + '" title="' + m.n + '：' + m.d + (m.next ? '（' + m.next + '）' : '') + '"><svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<path d="M30 0 H46 L56 34 H40 Z" fill="' + rib[0] + '"/><path d="M70 0 H54 L44 34 H60 Z" fill="' + rib[1] + '"/><path d="M36 0 H40 L50 34 H46 Z M64 0 H60 L50 34 H54 Z" fill="#f4e7c0" opacity=".7"/>' +
      '<rect x="38" y="30" width="24" height="7" rx="1.5" fill="' + dk + '"/>' +
      '<g fill="' + c + '" stroke="' + dk + '" stroke-width="1.2">' + sc + '</g><circle cx="50" cy="62" r="27" fill="' + c + '" stroke="' + dk + '" stroke-width="1.5"/>' +
      '<circle cx="50" cy="62" r="20" fill="none" stroke="' + dk + '" stroke-width="1" stroke-dasharray="1.5 2"/>' +
      (on ? '<path d="M33 52 A20 20 0 0 1 56 43" stroke="#fff" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>' : '') +
      '<g transform="translate(50 62) scale(1.15)" fill="none" stroke="' + dk + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + m.ic + '"/></g>' +
      '</svg><small>' + m.n + (on && !m.one ? '・' + TIERN[m.t] : '') + '</small><em>' + (m.next ? m.d + ' ' + m.next : m.d) + '</em></span>';
  }
  function checkAch(rare, p) {
    var before = {}; medals().forEach(function (m) { before[m.k] = m.t; });
    var h = new Date().getHours();
    me.total++;
    if (p) { var cr = (p.crop || '').split('、')[0]; if (cr) me.crop[cr] = (me.crop[cr] || 0) + 1; var ct = (p.loc || '').slice(0, 3); if (ct && me.county.indexOf(ct) < 0) me.county.push(ct); }
    function one(k) { if (!me.med[k]) me.med[k] = today(); }
    if (streak >= 5) one('s5'); if (streak >= 10) one('s10'); if (rare === 3) one('leg');
    if (h >= 22 || h < 5) one('owl'); if (h >= 5 && h < 8) one('sun'); if (me.days.length >= 3) one('ret');
    return medals().filter(function (m) { return m.t > (before[m.k] || 0); }).map(function (m) { return m.n + (m.one ? '' : '（' + TIERN[m.t] + '）'); });
  }
  function drawBook(fresh) {
    var el = document.getElementById('np-book'), names = Object.keys(book), n = names.length, rank = RANKS[0][1];
    RANKS.forEach(function (r) { if (n >= r[0]) rank = r[1]; });
    var cnt = [0, 0, 0, 0]; names.forEach(function (x) { cnt[book[x].t]++; });
    el.querySelector('.np-book-count').textContent = '收集 ' + n + (ALL.length ? ' / ' + ALL.length : '') + ' 種';
    el.querySelector('.np-book-rank').innerHTML = '藏家編號 <b>' + me.id + '</b>・稱號：' + rank + '<br>普通 ' + cnt[0] + '・稀有 ' + cnt[1] + '・珍藏 ' + cnt[2] + '・傳說 ' + cnt[3];
    var recent = names.sort(function (x, y) { return (book[y].at || 0) - (book[x].at || 0); }).slice(0, 5);
    el.querySelector('.np-book-recent').innerHTML = n ? recent.map(function (x) { return badge(x, book[x]); }).join('') : '<em>答對第一題，就能收集第一枚徽章。</em>';
    if (fresh) { var f = el.querySelector('.np-book-recent .bdg'); if (f) f.classList.add('new'); }
    var all = el.querySelector('.np-book-all');
    if (!all.hidden) all.innerHTML = ['dis', 'bug'].map(function (ty) {
        var gs = []; ALL.forEach(function (x) { var g = grp(x); if (g.type === ty && gs.indexOf(g.g) < 0) gs.push(g.g); });
        return '<p class="np-book-sec">' + (ty === 'dis' ? '病害' : '蟲害') + '</p>' + gs.map(function (g) { var xs = ALL.filter(function (x) { return grp(x).g === g; }); return '<p class="np-book-sub">' + g + '<span>' + xs.filter(function (x) { return book[x]; }).length + ' / ' + xs.length + '</span></p><div class="bdg-grid">' + xs.map(function (x) { return badge(x, book[x]); }).join('') + '</div>'; }).join('');
      }).join('') +
      (SHOW_MEDALS ? (function () { var ms = medals(); return '<p class="np-book-sec">特別成就（' + ms.filter(function (m) { return m.t; }).length + ' / ' + ms.length + '）</p><div class="bdg-grid mdl-grid">' + ms.map(medal).join('') + '</div>'; })() : '');
  }
  document.getElementById('np-book').addEventListener('click', function (e) {
    var t = e.target.closest('.bdg[data-n]'); if (!t) return;
    var n = t.getAttribute('data-n'), b = book[n], d = this.querySelector('.np-book-detail');
    d.hidden = false;
    d.innerHTML = '<div class="big">' + badge(n, b) + '</div><div><b>' + n + '</b><span class="grp">' + (grp(n).type === 'dis' ? '病害・' : '蟲害・') + grp(n).g + '</span><span class="rar t' + b.t + '">' + RAR[b.t][0] + '</span><br>No. ' + ('000' + b.no).slice(-4) + '・' + b.d + ' 取得<br>答對 ' + b.c + ' 次・藏家 ' + me.id + (b.t < 3 ? '<br><i>再答對這一題，有機會升級成更稀有的徽章</i>' : '') + '</div>';
  });
  document.querySelector('.np-book-open').onclick = function () {
    var all = document.querySelector('.np-book-all'); all.hidden = !all.hidden;
    this.textContent = all.hidden ? '翻開標本冊 ▸' : '闔上標本冊 ▴'; drawBook(false);
  };
  // 答對時呼叫：新徽章抽稀有度；已有的徽章有機會升級
  function collect(n, p) {
    var msg = '', b = book[n], r = roll(n);
    if (!b) { r.at = Date.now(); book[n] = r; msg = '獲得新徽章「' + n + '」<span class="rar t' + r.t + '">' + RAR[r.t][0] + '</span>'; }
    else { b.c++; b.at = Date.now(); if (r.t > b.t) { b.t = r.t; b.s = r.s; msg = '徽章「' + n + '」升級為<span class="rar t' + r.t + '">' + RAR[r.t][0] + '</span>！'; } }
    var ach = checkAch(book[n].t, p); save(); drawBook(true);
    if (SHOW_MEDALS && ach.length) msg += (msg ? '<br>' : '') + '獲得勳章：' + ach.map(function (x) { return '「' + x + '」'; }).join('');
    return msg;
  }
  drawBook(false);
  function nameOf(cap) {
    var t = cap.replace(/<[^>]*>/g, '').replace(/（[^）]*）|\([^)]*\)/g, '').split(/[，。、：；\s]/)[0].trim();
    return /^[一-鿿]{2,8}$/.test(t) && !/[的上之]|表面|症狀|危害/.test(t) && /(病|蟲|蝨|蛾|蟎|椿象|蠅|蚜|螟)$/.test(t) ? t : '';
  }
  fetch('{{ "/assets/photos.json" | relative_url }}').then(function (r) { return r.json(); }).then(function (list) {
    var pool = list.map(function (p) { return { p: p, n: nameOf(p.cap) }; }).filter(function (x) { return x.n; });
    var names = pool.map(function (x) { return x.n; }).filter(function (n, i, a) { return a.indexOf(n) === i; });
    if (pool.length < 4 || names.length < 4) { qz.hidden = true; return; }
    CROPS = pool.map(function (x) { return (x.p.crop || '').split('、')[0]; }).filter(function (c, i, a) { return c && a.indexOf(c) === i; });
    ALL = names.slice().sort(function (x, y) { return grp(x).i - grp(y).i || x.localeCompare(y, 'zh-Hant'); }); drawBook(false);
    function ask() {
      var q = pool[Math.floor(Math.random() * pool.length)], opts = [q.n];
      while (opts.length < 4) { var n = names[Math.floor(Math.random() * names.length)]; if (opts.indexOf(n) < 0) opts.push(n); }
      opts.sort(function () { return Math.random() - .5; });
      qz.querySelector('img').src = q.p.src;
      qz.querySelector('.np-quiz-msg').textContent = '';
      var box = qz.querySelector('.np-quiz-opts'); box.innerHTML = '';
      opts.forEach(function (o) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = o;
        b.onclick = function () {
          tries++; var prize = ''; if (o === q.n) { score++; streak++; var before = Math.floor(grown / PER); grown++; try { localStorage.setItem('pdjPlant', grown); } catch (e) {} drawPlant(Math.floor(grown / PER) > before); prize = collect(q.n, q.p); } else streak = 0;
          box.querySelectorAll('button').forEach(function (x) { x.disabled = true; if (x.textContent === q.n) x.className = 'ok'; else if (x === b) x.className = 'no'; });
          var m = qz.querySelector('.np-quiz-msg'); m.innerHTML = (o === q.n ? '答對了！' + (prize ? '<span class="np-prize-msg">' + prize + '</span>' : '') : '可惜，答案是「' + q.n + '」。') + ' <a href="' + q.p.url + '" data-go>看案件</a>・<button type="button" class="np-next">下一題 ▸</button>';
          m.querySelector('.np-next').onclick = ask;
          qz.querySelector('.np-quiz-score').textContent = '本次成績：' + score + ' / ' + tries;
        };
        box.appendChild(b);
      });
    }
    ask();
  });
})();
</script>
