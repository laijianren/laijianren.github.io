---
layout: default
---
<article class="entry">
  <p class="crumb"><a href="{{ '/visits/' | relative_url }}">← 所有參訪筆記</a></p>
  <h1>{{ page.title }}</h1>
  <dl class="facts">
    <div><dt>日期</dt><dd>{{ page.date | date: '%Y-%m-%d' }}</dd></div>
    {% if page.crop %}<div><dt>作物</dt><dd>{{ page.crop }}</dd></div>{% endif %}
    {% if page.location %}<div><dt>地點</dt><dd>{{ page.location }}</dd></div>{% endif %}
    {% if page.topics %}<div><dt>主題</dt><dd>{{ page.topics }}</dd></div>{% endif %}
  </dl>
  <div class="entry-body">{{ content }}</div>
</article>
