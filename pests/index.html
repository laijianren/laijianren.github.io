---
title: 病蟲害知識
---
<h1>病蟲害知識</h1>
{% assign groups = site.pests | group_by: 'category' %}
{% for g in groups %}
<h2>{{ g.name | default: '其他' }}</h2>
<div class="cards">
  {% for p in g.items %}
  <a class="card" href="{{ p.url | relative_url }}">
    <h3>{{ p.title }}</h3>
    <p>{{ p.summary }}</p>
  </a>
  {% endfor %}
</div>
{% endfor %}
