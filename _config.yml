# 網站基本設定（改這裡的文字，網站標題就會跟著變）
title: 植物診療室
description: 植物診療師 Lai 的田間診斷案件紀錄、病蟲害知識、全球疫情週報與作物用藥圖表
author: 植物診療師 Lai      # 報頭上的署名
motto: 田間診斷・病蟲害圖鑑・核准用藥
lang: zh-Hant-TW
url: https://laijianren.github.io
hide_pending: true   # true：只寫「（待補充）」的段落先不顯示；改成 false 就會顯示

plugins:
  - jekyll-sitemap   # 自動產生 sitemap.xml，方便搜尋引擎收錄

collections:
  cases:          # 診斷案件，檔案放在 _cases 資料夾
    output: true
    permalink: /cases/:name/
  pests:          # 病蟲害知識，檔案放在 _pests 資料夾
    output: true
    permalink: /pests/:name/
  visits:         # 參訪筆記（觀摩會、田間參訪），檔案放在 _visits 資料夾
    output: true
    permalink: /visits/:name/

defaults:
  - scope: { path: "", type: cases }
    values: { layout: case }
  - scope: { path: "", type: pests }
    values: { layout: pest }
  - scope: { path: "", type: visits }
    values: { layout: visit }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - _templates
